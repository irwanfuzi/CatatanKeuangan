<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Viewer Aplikasi</title>
    
    <style type="text/css">
        /* --- Base & Layout Styles --- */
        body {
            margin: 0;
            padding: 0;
            background-color: #9e9e9e;
            font-family: system-ui, -apple-system, sans-serif;
        }
        
        #sidebar {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            width: 250px;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            background-color: #2f3236;
            box-shadow: 2px 0 5px rgba(0,0,0,0.2);
            z-index: 10;
        }
        
        #outline {
            font-size: 14px;
            margin: 2em 1em;
        }
        
        #outline ul {
            padding: 0;
            list-style-type: none;
            margin: 0;
        }
        
        #outline li {
            margin: 0.8em 0;
        }
        
        #outline a {
            line-height: 1.4;
            color: #e8e8e8;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-decoration: none;
            display: block;
            overflow: hidden;
            outline: 0;
            transition: color 0.2s ease;
        }
        
        #outline a:hover {
            color: #00ccff;
        }
        
        #page-container {
            position: absolute;
            top: 0;
            left: 250px;
            bottom: 0;
            right: 0;
            margin: 0;
            padding: 0;
            border: 0;
            overflow: auto;
            background-color: #9e9e9e;
            transition: left 0.3s ease;
        }
        
        /* --- PDF Page Styles --- */
        .pf {
            position: relative;
            background-color: white;
            overflow: hidden;
            margin: 20px auto;
            border: 0;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            width: 1536px;
            height: 1536px;
        }
        
        .pc {
            position: absolute;
            border: 0;
            padding: 0;
            margin: 0;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: block;
            transform-origin: 0 0;
        }
        
        .bi {
            position: absolute;
            border: 0;
            margin: 0;
            user-select: none;
            left: 0;
            bottom: -0.5px;
            width: 1536.5px;
            height: 1536.5px;
            max-width: 100%;
        }
        
        /* --- Print Optimization --- */
        @media print {
            #sidebar { 
                display: none; 
            }
            #page-container { 
                left: 0; 
                width: auto; 
                height: auto; 
                overflow: visible; 
                background-color: transparent; 
            }
            .pf { 
                margin: 0; 
                box-shadow: none; 
                page-break-after: always; 
                page-break-inside: avoid; 
            }
        }
    </style>
</head>

    <!-- Core Javascript Handling -->
    <script type="text/javascript">
        (function() {
            'use strict';
            
            window.pdf2htmlEX = window.pdf2htmlEX || {};
            
            // Definisikan Object Viewer
            function Viewer(config) {
                this.container = document.getElementById(config.container_id);
                this.sidebar = document.getElementById(config.sidebar_id);
                this.pages = this.container.getElementsByClassName('pf');
                this.init();
            }

            Viewer.prototype.init = function() {
                // Skrip internal untuk deteksi scroll dan navigasi sidebar
                this.setupNavigation();
                console.log("PDF Viewer Engine initialized successfully.");
            };

            Viewer.prototype.setupNavigation = function() {
                const links = this.sidebar.querySelectorAll('a');
                links.forEach(link => {
                    link.addEventListener('click', (e) => {
                        e.preventDefault();
                        const targetId = link.getAttribute('href').substring(1);
                        const targetPage = document.getElementById(targetId);
                        if (targetPage) {
                            targetPage.scrollIntoView({ behavior: 'smooth' });
                        }
                    });
                });
            };

            window.pdf2htmlEX.Viewer = Viewer;
        })();

        // Jalankan Script setelah DOM ter-load penuh
        document.addEventListener("DOMContentLoaded", function() {
            if (document.getElementById("page-container") && document.getElementById("sidebar")) {
                new window.pdf2htmlEX.Viewer({
                    container_id: "page-container",
                    sidebar_id: "sidebar"
                });
            }
        });
    </script>
