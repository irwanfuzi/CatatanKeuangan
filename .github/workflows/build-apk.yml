name: Build Flutter APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Tarik Code Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3' # 👈 TAMBAHKAN BARIS INI (Kunci versi Flutter)
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Folder Android
        run: flutter create --platforms=android .

      - name: Build APK Native (Release)
        run: flutter build apk --release

      - name: Upload APK Jadi
        uses: actions/upload-artifact@v4
        with:
          name: MyKas-Native-APK
          path: build/app/outputs/flutter-apk/app-release.apk
