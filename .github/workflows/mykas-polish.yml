name: Integrate latest MyKas polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, 'integrate latest MyKas polish into index') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Integrate latest dashboard polish into index
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="dashboard-redesign.js"></script>'
          if tag not in s:
              marker = '</head>'
              if marker not in s:
                  raise SystemExit('Could not find </head> in index.html')
              s = s.replace(marker, f'  {tag}\n{marker}', 1)
              p.write_text(s, encoding='utf-8')

      - name: Commit index integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No index changes to commit'
            exit 0
          fi
          git commit -m 'integrate latest MyKas polish into index'
          git push
