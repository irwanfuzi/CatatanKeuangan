name: Integrate latest MyKas polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, 'integrate latest MyKas polish into index') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Inline dashboard polish into index
        shell: python
        run: |
          from pathlib import Path
          index = Path('index.html')
          polish = Path('dashboard-redesign.js')

          s = index.read_text(encoding='utf-8')
          js = polish.read_text(encoding='utf-8')

          external_tag = '<script src="dashboard-redesign.js"></script>'
          inline_tag = '<script>\n' + js + '\n  </script>'

          if external_tag in s:
              s = s.replace(external_tag, inline_tag, 1)
          elif 'mykas-premium-sizing-v2' not in s:
              marker = '</head>'
              if marker not in s:
                  raise SystemExit('Could not find </head> in index.html')
              s = s.replace(marker, '  ' + inline_tag + '\n' + marker, 1)
          else:
              print('MyKas polish is already inline in index.html')

          index.write_text(s, encoding='utf-8')

      - name: Commit index-only result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f dashboard-redesign.js .github/workflows/mykas-polish.yml
          git add index.html dashboard-redesign.js .github/workflows/mykas-polish.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'integrate latest MyKas polish into index'
          git push
