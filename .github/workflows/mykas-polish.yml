name: Apply MyKas dashboard polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    if: ${{ !contains(github.event.head_commit.message, 'Apply MyKas dashboard 10/10 polish') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply dashboard polish
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<style id="mykas-10-polish">'
          if marker in s:
              raise SystemExit('Polish already applied')
          css = r'''<style id="mykas-10-polish">
          :root{--mk-blue:#1769FF;--mk-blue-deep:#0758EA;--mk-gold:#FFB901;--mk-navy:#1E293B;--mk-bg:#F7F9FC}
          #screenDashboard{background:var(--mk-bg)!important}
          .dashboard-header{height:74px!important;padding:0 18px!important;background:rgba(255,255,255,.96)!important;border-bottom:1px solid rgba(226,232,240,.72)!important;box-shadow:0 1px 0 rgba(15,23,42,.015)!important}
          .dashboard-brand{gap:9px!important}.dashboard-logo-mark{width:52px!important;height:44px!important}.dashboard-brand-text{font-size:29px!important;letter-spacing:-1.35px!important}
          .dashboard-header-actions{gap:8px!important}.header-icon-btn{width:40px!important;height:40px!important;font-size:19px!important}.header-profile-btn{width:42px!important;height:42px!important}
          .dashboard-content{padding:15px 16px 112px!important;gap:19px!important}
          .hero-assets-card{min-height:194px!important;border-radius:28px!important;padding:22px 20px!important;background:linear-gradient(135deg,#1B67F6 0%,#0758EA 100%)!important;box-shadow:0 16px 32px rgba(23,105,255,.20)!important}
          .hero-pattern{right:-12px!important;top:-16px!important;width:225px!important;height:225px!important;opacity:.14!important;background-size:17px 17px!important}
          .hero-copy{width:66%!important}.hero-label-row{font-size:14px!important;gap:8px!important}.hero-label-row button{font-size:15px!important}
          .hero-balance{margin:11px 0 13px!important;font-size:clamp(31px,9.5vw,37px)!important;letter-spacing:-1.65px!important}
          .hero-growth-row{font-size:11px!important;gap:8px!important}.hero-growth{padding:6px 10px!important}.hero-updated{margin-top:15px!important;font-size:10px!important}
          .hero-wallet{right:1.5%!important;bottom:1%!important;width:42%!important;max-width:176px!important}.hero-wallet-svg{filter:drop-shadow(0 13px 13px rgba(0,0,0,.18))!important;transform:rotate(-2deg) scale(1.04)!important}
          .section-heading h2,.section-title-only{font-size:17px!important;letter-spacing:-.4px!important}.section-heading button,.panel-heading button{font-size:11px!important}
          .wallet-grid{gap:9px!important}.wallet-card{min-height:158px!important;padding:13px 7px 11px!important;border-radius:21px!important;border-color:#EDF1F6!important;box-shadow:0 6px 18px rgba(15,23,42,.045)!important}.wallet-icon{width:49px!important;height:49px!important;border-radius:16px!important}.wallet-name{font-size:11px!important;margin-top:10px!important}.wallet-card strong{font-size:12px!important}.wallet-card small{font-size:9px!important}.wallet-progress{height:5px!important;width:82%!important}
          .quick-action-card{min-height:108px!important;border-radius:21px!important;border-color:#EDF1F6!important;box-shadow:0 6px 18px rgba(15,23,42,.045)!important}.quick-action-item{gap:9px!important}.quick-action-item span{width:36px!important;height:36px!important;font-size:23px!important}.quick-action-item b{font-size:10px!important}
          .dashboard-module-grid{grid-template-columns:minmax(0,1.43fr) minmax(0,1fr)!important;gap:10px!important}.dashboard-panel{border-radius:22px!important;padding:14px 12px!important;border-color:#EDF1F6!important;box-shadow:0 6px 18px rgba(15,23,42,.045)!important}.panel-heading{margin-bottom:11px!important}.panel-heading h2{font-size:13px!important}
          .budget-value{font-size:21px!important}.budget-tip{border-radius:16px!important;padding:10px!important}.budget-tip p{font-size:9px!important}
          .insight-card{min-height:92px!important;border-radius:22px!important;padding:13px 14px!important;box-shadow:0 6px 18px rgba(23,105,255,.035)!important}.insight-icon{width:48px!important;height:48px!important;border-radius:15px!important}.insight-copy b{font-size:13px!important}.insight-copy p{font-size:10px!important}.insight-chart{width:78px!important}
          #mainFixedNavbar.integrated-bottom-dock{height:76px!important;padding:0 7px env(safe-area-inset-bottom)!important;background:rgba(255,255,255,.975)!important;border-top:1px solid #E7ECF2!important;box-shadow:0 -10px 28px rgba(15,23,42,.075)!important;grid-template-columns:repeat(5,minmax(0,1fr))!important}
          .dock-nav-item{height:64px!important;min-width:0!important;gap:4px!important;color:#94A3B8!important}.dock-nav-item i{font-size:21px!important}.dock-nav-item span{font-size:9px!important;font-weight:800!important}.dock-nav-item.active{color:var(--mk-blue)!important}.dock-center-slot{height:76px!important;display:flex!important;align-items:flex-start!important;justify-content:center!important;position:relative!important}.dock-add-btn{width:64px!important;height:64px!important;margin-top:-25px!important;border-radius:21px!important;background:linear-gradient(145deg,#1769FF,#0758EA)!important;color:#fff!important;border:5px solid #F8FAFC!important;box-shadow:0 12px 24px rgba(23,105,255,.30)!important;font-size:27px!important;display:flex!important;align-items:center!important;justify-content:center!important}.dock-add-btn:active{transform:scale(.96)!important}
          .transaction-list{gap:11px!important}
          @media(max-width:380px){.dashboard-content{padding-left:13px!important;padding-right:13px!important;gap:17px!important}.hero-assets-card{padding:20px 17px!important;min-height:188px!important}.hero-copy{width:68%!important}.hero-balance{font-size:30px!important}.hero-wallet{width:39%!important}.wallet-grid{gap:7px!important}.wallet-card{min-height:151px!important;padding-left:5px!important;padding-right:5px!important}.wallet-icon{width:45px!important;height:45px!important}.quick-action-card{min-height:102px!important}.quick-action-item b{font-size:9px!important}.dashboard-module-grid{gap:8px!important}.dashboard-panel{padding:12px 10px!important}}
          @media(min-width:768px){.dashboard-content{padding-left:18px!important;padding-right:18px!important}.hero-assets-card{min-height:198px!important}}
          body.dark #screenDashboard{background:#0B132B!important}body.dark .dashboard-header{background:rgba(19,28,53,.96)!important;border-bottom-color:#1E293B!important}body.dark .wallet-card,body.dark .quick-action-card,body.dark .dashboard-panel{background:#131C35!important;border-color:#1E293B!important}body.dark .section-heading h2,body.dark .section-title-only,body.dark .wallet-name,body.dark .wallet-card strong,body.dark .panel-heading h2{color:#F8FAFC!important}body.dark #mainFixedNavbar.integrated-bottom-dock{background:rgba(15,23,42,.97)!important;border-top-color:#26334A!important}.dark .dock-add-btn{border-color:#0B132B!important}
          </style>'''
          s = s.replace('</head>', css + '\n</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit polish and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/mykas-polish.yml
          git commit -m 'Apply MyKas dashboard 10/10 polish'
          git rm .github/workflows/mykas-polish.yml
          git commit -m 'chore: remove one-time polish workflow'
          git push