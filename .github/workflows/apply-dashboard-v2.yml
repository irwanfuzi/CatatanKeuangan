name: Apply MyKas Dashboard V2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[dashboard-v2]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          index = Path('index.html').read_text()
          dash = Path('dashboard-v2.html').read_text()
          css = Path('dashboard-v2.css').read_text()
          start = index.index('    <!-- ==================== SCREEN 4: MAIN DASHBOARD APP ==================== -->')
          end = index.index('    <!-- MODAL FORM INPUT TRANSAKSI -->', start)
          index = index[:start] + dash + index[end:]
          style_end = index.index('  </style>')
          if '/* ==================== MYKAS DASHBOARD V2 ==================== */' not in index:
              index = index[:style_end] + '\n\n    ' + css + '\n' + index[style_end:]
          Path('index.html').write_text(index)
          PY

      - name: Commit final index.html and cleanup
        run: |
          rm -f dashboard-v2.html dashboard-v2.css .github/workflows/apply-dashboard-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html dashboard-v2.html dashboard-v2.css .github/workflows/apply-dashboard-v2.yml
          git commit -m "Polish MyKas dashboard UI [dashboard-v2]" || exit 0
          git push
