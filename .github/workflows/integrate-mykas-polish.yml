name: Integrate MyKas polish into index

on:
  push:
    paths:
      - '.github/workflows/integrate-mykas-polish.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate dashboard polish
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="dashboard-redesign.js"></script>'
          if tag not in text:
              marker = '</head>'
              if marker not in text:
                  raise SystemExit('Could not find </head> in index.html')
              text = text.replace(marker, f'  {tag}\n{marker}', 1)
              p.write_text(text, encoding='utf-8')

      - name: Commit integrated index and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/integrate-mykas-polish.yml
          git add index.html .github/workflows/integrate-mykas-polish.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: integrate latest MyKas polish into index"
          git push
