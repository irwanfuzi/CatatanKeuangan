name: Integrate MyKas navbar tabs

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Integrate navbar tabs into index
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- MYKAS_NAVBAR_TABS_V3 -->'
          if marker in s:
              print('Navbar tabs already integrated')
              raise SystemExit(0)
          addon=r'''<!-- MYKAS_NAVBAR_TABS_V3 -->
<style>
#mykasTabPages{display:none}#mykasTabPages.open{display:block}.mykasTabPage{min-height:calc(100vh - 140px);padding:18px 16px 110px;background:#F8FAFC}.mykasTabInner{max-width:448px;margin:auto;display:flex;flex-direction:column;gap:14px}.mykasTabTitle{font:900 25px 'Urbanist',sans-serif;color:#1E293B;letter-spacing:-.7px;margin:4px 2px 0}.mykasTabSub{font-size:11px;font-weight:600;color:#94A3B8;margin:0 2px 3px}.mykasTabCard{background:#fff;border:1px solid #EDF1F6;border-radius:21px;padding:15px;box-shadow:0 6px 18px rgba(15,23,42,.045)}.mykasTabCard h3{margin:0 0 12px;font:900 14px 'Urbanist',sans-serif;color:#1E293B}.mykasStatGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mykasStat{background:#fff;border:1px solid #EDF1F6;border-radius:20px;padding:15px}.mykasStat span{display:block;font-size:10px;font-weight:700;color:#94A3B8;margin-bottom:7px}.mykasStat strong{font:900 18px 'Urbanist',sans-serif;color:#1E293B}.mykasWallet{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid #F1F5F9}.mykasWallet:last-child{border-bottom:0}.mykasWalletIcon{width:40px;height:40px;border-radius:13px;background:#EEF5FF;color:#1769FF;display:flex;align-items:center;justify-content:center}.mykasWalletText{flex:1}.mykasWalletText b{display:block;font-size:11px;color:#1E293B}.mykasWalletText span{display:block;font-size:9px;color:#94A3B8;margin-top:3px}.mykasWalletValue{font:900 12px 'Urbanist',sans-serif;color:#1E293B}.mykasProfile{display:flex;align-items:center;gap:12px}.mykasAvatar{width:52px;height:52px;border-radius:18px;background:#1769FF;color:#fff;display:flex;align-items:center;justify-content:center}.mykasSetting{width:100%;display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #F1F5F9;background:none;text-align:left}.mykasSetting:last-child{border:0}.mykasSetting i{width:36px;height:36px;border-radius:12px;background:#F1F5F9;display:flex;align-items:center;justify-content:center;color:#1E293B}.mykasSetting b{font-size:11px;color:#1E293B}.mykasSetting span{margin-left:auto;font-size:9px;color:#94A3B8}.mykasLogout{color:#E11D48}.mykasLogout i{color:#E11D48;background:#FFF1F2}body.dark .mykasTabPage{background:#0B132B}body.dark .mykasTabCard,body.dark .mykasStat{background:#131C35;border-color:#1E293B}body.dark .mykasTabTitle,body.dark .mykasTabCard h3,body.dark .mykasStat strong,body.dark .mykasWalletText b,body.dark .mykasWalletValue,body.dark .mykasSetting b{color:#F8FAFC}body.dark .mykasWallet,body.dark .mykasSetting{border-color:#1E293B}
</style>
<script>
(function(){function boot(){const nav=document.getElementById('mainFixedNavbar'),main=document.querySelector('#screenDashboard main'),riwayat=document.getElementById('pageRiwayat'),dash=document.getElementById('screenDashboard');if(!nav||!main||!riwayat||!dash)return;nav.innerHTML='<button id="mkHome" class="dock-nav-item active" type="button"><i class="fa-solid fa-house"></i><span>Beranda</span></button><button id="mkAnalysis" class="dock-nav-item" type="button"><i class="fa-solid fa-chart-pie"></i><span>Analisis</span></button><div class="dock-center-slot"><button id="mkAdd" class="dock-add-btn" type="button"><i class="fa-solid fa-plus"></i></button></div><button id="mkWallet" class="dock-nav-item" type="button"><i class="fa-solid fa-wallet"></i><span>Dompet</span></button><button id="mkProfile" class="dock-nav-item" type="button"><i class="fa-regular fa-user"></i><span>Profil</span></button>';let pages=document.getElementById('mykasTabPages');if(!pages){pages=document.createElement('div');pages.id='mykasTabPages';pages.innerHTML='<section id="mkAnalysisPage" class="mykasTabPage hidden"><div class="mykasTabInner"><h1 class="mykasTabTitle">Analisis</h1><p class="mykasTabSub">Lihat perkembangan keuanganmu dengan lebih jelas.</p><div class="mykasStatGrid"><div class="mykasStat"><span>Total Aset</span><strong id="mkBalance">Rp0</strong></div><div class="mykasStat"><span>Pengeluaran</span><strong id="mkExpense">Rp0</strong></div></div></div></section><section id="mkWalletPage" class="mykasTabPage hidden"><div class="mykasTabInner"><h1 class="mykasTabTitle">Dompet</h1><p class="mykasTabSub">Semua penyimpanan uangmu dalam satu tempat.</p><div class="mykasTabCard"><h3>Dompet Saya</h3><div id="mkWalletList"></div></div></div></section><section id="mkProfilePage" class="mykasTabPage hidden"><div class="mykasTabInner"><h1 class="mykasTabTitle">Profil</h1><p class="mykasTabSub">Kelola akun dan preferensi MyKas.</p><div class="mykasProfile"><div class="mykasAvatar"><i class="fa-regular fa-user"></i></div><div><b style="font:900 17px Urbanist;color:#1E293B">Akun MyKas</b><div style="font-size:10px;color:#94A3B8;margin-top:3px">Pengaturan akun & aplikasi</div></div></div><div class="mykasTabCard"><button id="mkLanguage" class="mykasSetting"><i class="fa-solid fa-language"></i><b>Bahasa</b><span>Indonesia</span></button><button id="mkTheme" class="mykasSetting"><i class="fa-solid fa-moon"></i><b>Tampilan</b><span>Ubah tema</span></button><button id="mkLogout" class="mykasSetting mykasLogout"><i class="fa-solid fa-arrow-right-from-bracket"></i><b>Keluar</b><span></span></button></div></div></section>';dash.appendChild(pages)}const homeItems=[...main.children].filter(x=>x!==riwayat),pA=document.getElementById('mkAnalysisPage'),pW=document.getElementById('mkWalletPage'),pP=document.getElementById('mkProfilePage'),tabs=[document.getElementById('mkHome'),document.getElementById('mkAnalysis'),document.getElementById('mkWallet'),document.getElementById('mkProfile')];function sync(){document.getElementById('mkBalance').textContent=window.rawTotalSaldo||document.getElementById('txtSaldo')?.textContent||'Rp0';document.getElementById('mkExpense').textContent=window.rawPengeluaran||'Rp0';const a=[['Tunai','txtWalletTunaiHidden','fa-money-bill-wave'],['Rekening Bank','txtWalletBankHidden','fa-landmark'],['E-Wallet','txtWalletDigitalHidden','fa-mobile-screen-button'],['Tabungan','txtWalletTabunganHidden','fa-piggy-bank']];document.getElementById('mkWalletList').innerHTML=a.map(x=>'<div class="mykasWallet"><div class="mykasWalletIcon"><i class="fa-solid '+x[2]+'"></i></div><div class="mykasWalletText"><b>'+x[0]+'</b><span>Saldo tersimpan</span></div><strong class="mykasWalletValue">'+(document.getElementById(x[1])?.value||'Rp0')+'</strong></div>').join('')}function show(name){main.style.display=name==='home'?'':'none';riwayat.classList.toggle('hidden',name!=='analysis');pages.classList.toggle('open',name!=='home');pA.classList.toggle('hidden',name!=='analysis');pW.classList.toggle('hidden',name!=='wallet');pP.classList.toggle('hidden',name!=='profile');tabs.forEach((x,i)=>x.classList.toggle('active',(name==='home'&&i===0)||(name==='analysis'&&i===1)||(name==='wallet'&&i===2)||(name==='profile'&&i===3)));sync()}document.getElementById('mkHome').onclick=()=>show('home');document.getElementById('mkAnalysis').onclick=()=>show('analysis');document.getElementById('mkWallet').onclick=()=>show('wallet');document.getElementById('mkProfile').onclick=()=>show('profile');document.getElementById('mkAdd').onclick=()=>window.bukaModalTambahTransaksi();document.getElementById('mkLanguage').onclick=()=>window.bukaBottomSheetBahasa();document.getElementById('mkTheme').onclick=()=>window.toggleDarkMode();document.getElementById('mkLogout').onclick=()=>window.logoutUser();sync()}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot()})();
</script>'''
          s=s.replace('</body>',addon+'\n</body>',1)
          p.write_text(s,encoding='utf-8')

      - name: Commit integration to PR branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: add MyKas navbar tabs into index'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
