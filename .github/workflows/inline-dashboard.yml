name: Inline Dashboard Redesign

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inline-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inline dashboard redesign into index.html
        shell: python
        run: |
          from pathlib import Path

          index = Path('index.html')
          redesign = Path('dashboard-redesign.js')
          sw = Path('sw.js')

          html = index.read_text(encoding='utf-8')
          js = redesign.read_text(encoding='utf-8').strip()
          marker_start = '<!-- MYKAS DASHBOARD REDESIGN INLINE START -->'
          marker_end = '<!-- MYKAS DASHBOARD REDESIGN INLINE END -->'

          block = f'''{marker_start}\n<script id="mykas-dashboard-redesign-inline">\n{js}\n</script>\n{marker_end}'''

          if marker_start in html and marker_end in html:
              before = html.split(marker_start, 1)[0]
              after = html.split(marker_end, 1)[1]
              html = before + block + after
          else:
              html = html.replace('</body>', block + '\n</body>', 1)

          index.write_text(html, encoding='utf-8')

          # The redesign is now inline in index.html, so Service Worker must not inject it again.
          sw_text = sw.read_text(encoding='utf-8')
          old = """        const html = await networkResponse.text();\n        const injected = html.replace(\n          '</body>',\n          '<script src=\"./dashboard-redesign.js\"></script></body>'\n        );\n        const response = new Response(injected, {"""
          new = """        const html = await networkResponse.text();\n        const response = new Response(html, {"""
          sw_text = sw_text.replace(old, new)
          sw_text = sw_text.replace("const CACHE_NAME = 'mykas-pwa-v3';", "const CACHE_NAME = 'mykas-pwa-v5';")
          sw.write_text(sw_text, encoding='utf-8')

      - name: Commit generated index.html
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat: inline dashboard redesign into index"
          git push

      - name: Remove one-time workflow
        shell: bash
        run: |
          git rm .github/workflows/inline-dashboard.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: remove one-time dashboard workflow"
          git push
