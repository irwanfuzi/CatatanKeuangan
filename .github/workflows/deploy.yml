name: Build & Deploy Flutter PWA Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Tarik Code Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter (Lock Version 3.24.3)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      # 1. KOMPILASI FLUTTER WEB DENGAN BASE-HREF PERBAIKAN UNTUK GITHUB PAGES
      - name: Build Flutter Web
        run: flutter build web --release --base-href "/MyKas/" --no-tree-shake-icons

      # 2. AUTOMATIC COMMIT & PUSH BUNDLE BUILD/WEB KE MAIN BRANCH UNTUK VERCEL
      - name: Commit & Push build/web ke Main Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add build/web -f
          git commit -m "chore: auto-update web build artifacts for vercel & gh-pages" || echo "No changes to commit"
          git push origin main || echo "No changes to push"

      # 3. UPLOAD WEB ARTIFACT UNTUK GITHUB PAGES
      - name: Upload Web Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-web:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
