<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="MyKas - Own Your Money">

  <!-- Meta Tag Wajib PWA & iOS Safari -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MyKas">
  <meta name="theme-color" content="#0D47A1">

  <!-- Favicon ICO Browser -->
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Apple Touch Icons PWA -->
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <title>MyKas - Own Your Money</title>
  <link rel="manifest" href="manifest.json">

  <!-- Bridge JS Interop untuk Prompt PWA -->
  <script>
    let deferredPwaPrompt = null;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPwaPrompt = e;
      if (window.onPwaPromptReady) {
        window.onPwaPromptReady(true);
      }
    });

    window.triggerPwaInstall = function() {
      if (deferredPwaPrompt) {
        deferredPwaPrompt.prompt();
        deferredPwaPrompt.userChoice.then((choiceResult) => {
          deferredPwaPrompt = null;
          if (window.onPwaPromptReady) {
            window.onPwaPromptReady(false);
          }
        });
      }
    };
  </script>

  <script src="flutter.js" defer></script>
</head>
<body style="background-color: #0F1117;">
  <script>
    window.addEventListener('load', function(ev) {
      // Inisialisasi Flutter Engine Loader v2 (Bebas Deprecation Warning)
      _flutter.loader.load({
        serviceWorkerSettings: {
          serviceWorkerVersion: null,
        },
      });
    });
  </script>
</body>
</html>
