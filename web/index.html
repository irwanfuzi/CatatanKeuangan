<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="MyKas - Own Your Money">

  <!-- Hindari Cache Versi Lama -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- Meta Tag PWA & iOS Safari -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MyKas">
  <meta name="theme-color" content="#0052FF">

  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.json">

  <title>MyKas - Own Your Money</title>

  <style>
    body {
      background-color: #0F172A;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      transition: opacity 0.4s ease;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top-color: #0052FF;
      animation: spin 0.8s ease-in-out infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      color: #94A3B8;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
  </style>

  <script src="flutter.js" defer></script>
</head>
<body>
  <div class="loading-container" id="app-loading">
    <div class="spinner"></div>
    <div class="loading-text">Memuat MyKas...</div>
  </div>

  <script>
    function removeLoader() {
      var loadingEl = document.getElementById('app-loading');
      if (loadingEl) {
        loadingEl.style.opacity = '0';
        setTimeout(function() {
          if (loadingEl && loadingEl.parentNode) {
            loadingEl.parentNode.removeChild(loadingEl);
          }
        }, 400);
      }
    }

    window.addEventListener('load', function(ev) {
      // Fail-safe Timeout: Lepas spinner setelah 5 detik jika script terlambat
      var fallbackTimer = setTimeout(removeLoader, 5000);

      _flutter.loader.load({
        serviceWorkerSettings: {
          serviceWorkerVersion: null,
        },
        onEntrypointLoaded: async function(engineInitializer) {
          clearTimeout(fallbackTimer);
          const appRunner = await engineInitializer.initializeEngine();
          removeLoader();
          await appRunner.runApp();
        }
      });
    });
  </script>
</body>
</html>
